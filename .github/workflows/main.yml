name : etl pipeline

on:
  push:
    branches:
      - main
    
jobs:
  extract-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Run extract.py
        run: python extract.py

        
  transform-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Run transform.py
        run: python transform.py


  load-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Run load.py
        run: python load.py